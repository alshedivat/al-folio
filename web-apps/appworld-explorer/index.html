<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore AppWorld benchmark tasks and agent trajectories across models"
    />
    <meta name="theme-color" content="#f3efe9" />
    <link rel="icon" href="/web-apps/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/web-apps/manifest.json" />
    <link
      rel="canonical"
      href="https://yoonholee.com/web-apps/appworld-explorer/"
    />
    <meta property="og:title" content="AppWorld Explorer" />
    <meta
      property="og:description"
      content="Explore AppWorld benchmark tasks and agent trajectories across models"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://yoonholee.com/web-apps/appworld-explorer/"
    />
    <title>AppWorld Explorer</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="/web-apps/shared.css" />
    <style>
      :root {
        --accent: oklch(58% 0.17 275);
        --accent-soft: oklch(58% 0.17 275 / 12%);
      }

      /* Layout */
      .app {
        display: grid;
        grid-template-columns: 440px 1fr;
        grid-template-rows: auto 1fr;
        height: calc(100vh - 32px);
        overflow: hidden;
        max-width: 1600px;
        margin: 16px auto;
        border-radius: var(--radius-lg);
        border: 1px solid var(--line);
        box-shadow: var(--shadow-md);
      }

      .app-header {
        grid-column: 1 / -1;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      }

      /* Sidebar */
      .sidebar {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        overflow: hidden;
        background: var(--bg);
      }

      .sidebar-controls {
        padding: var(--sp-3) var(--sp-4);
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
      }

      .search-input {
        width: 100%;
        padding: var(--sp-2) var(--sp-3);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        color: var(--ink);
        font-size: 0.8125rem;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s var(--ease);
      }

      .search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .filter-row {
        display: flex;
        gap: var(--sp-2);
      }

      .filter-row select {
        flex: 1;
        padding: var(--sp-1) var(--sp-2);
        font-size: 0.75rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        color: var(--ink-2);
        font-family: inherit;
      }

      .task-list {
        flex: 1;
        overflow-y: auto;
        padding: var(--sp-2);
      }

      .task-item {
        display: flex;
        flex-direction: column;
        gap: var(--sp-1);
        padding: var(--sp-3);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background 0.15s var(--ease);
        border: 1px solid transparent;
      }

      .task-item:hover {
        background: var(--bg-surface);
      }

      .task-item.active {
        background: var(--bg-surface);
        border-color: var(--accent);
        box-shadow: var(--shadow-sm);
      }

      .task-item-name {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.01em;
      }

      .task-item-instruction {
        font-size: 0.75rem;
        color: var(--ink-2);
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .task-item-meta {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        flex-wrap: wrap;
      }

      .task-item-bars {
        display: flex;
        gap: 2px;
        align-items: flex-end;
        height: 14px;
        margin-left: auto;
      }

      .task-item-bar {
        width: 6px;
        border-radius: 1px;
        min-height: 2px;
      }

      /* Mini badges */
      .mini-badge {
        display: inline-flex;
        align-items: center;
        padding: 1px 6px;
        font-size: 0.6875rem;
        font-weight: 500;
        border-radius: var(--radius-pill);
        line-height: 1.6;
      }

      .mini-badge.d1 {
        background: oklch(72% 0.19 145 / 15%);
        color: oklch(40% 0.15 145);
      }
      .mini-badge.d2 {
        background: oklch(72% 0.17 85 / 15%);
        color: oklch(45% 0.15 85);
      }
      .mini-badge.d3 {
        background: oklch(63% 0.24 27 / 15%);
        color: oklch(45% 0.2 27);
      }

      .mini-split {
        font-size: 0.6875rem;
        color: var(--ink-3);
      }

      /* Main content */
      .main {
        overflow-y: auto;
        padding: var(--sp-8) var(--sp-10);
        display: flex;
        flex-direction: column;
        gap: var(--sp-8);
      }

      .main.empty-state {
        align-items: center;
        justify-content: center;
      }

      .empty-msg {
        color: var(--ink-3);
        font-size: 0.9375rem;
      }

      /* Task header */
      .task-header {
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }

      .task-title {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--ink);
      }

      .task-badges {
        display: flex;
        gap: var(--sp-2) var(--sp-3);
        align-items: center;
        flex-wrap: wrap;
      }

      .meta-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        font-size: 0.8125rem;
        color: var(--ink-2);
        background: var(--bg-surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
      }

      .meta-chip strong {
        font-weight: 600;
        color: var(--ink);
      }

      /* Score bars */
      .scores-section {
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
      }

      .score-row {
        display: grid;
        grid-template-columns: 180px 1fr 48px;
        align-items: center;
        gap: var(--sp-4);
      }

      .score-label {
        font-size: 0.875rem;
        color: var(--ink-2);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .score-bar-bg {
        height: 24px;
        background: var(--bg);
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid var(--line);
      }

      .score-bar-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.3s var(--ease);
      }

      .score-pct {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      /* Section heading */
      .section-heading {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--ink-2);
        margin-bottom: var(--sp-4);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* Instruction */
      .instruction-text {
        font-size: 0.9rem;
        line-height: 1.75;
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 300px;
        overflow-y: auto;
        padding: var(--sp-5);
        background: var(--bg);
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
      }

      /* Tabs */
      .detail-tabs {
        display: flex;
        gap: var(--sp-2);
        border-bottom: 1px solid var(--line);
        padding-bottom: var(--sp-2);
      }

      .detail-tab {
        padding: var(--sp-2) var(--sp-4);
        font-size: 0.875rem;
        font-weight: 500;
        font-family: inherit;
        color: var(--ink-3);
        background: none;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all 0.15s var(--ease);
      }

      .detail-tab:hover {
        color: var(--ink);
        background: var(--bg-surface);
      }

      .detail-tab.active {
        color: var(--accent);
        background: var(--accent-soft);
        font-weight: 600;
      }

      /* Trials table */
      .trials-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
      }

      .trials-table th {
        text-align: left;
        padding: var(--sp-3) var(--sp-4);
        font-weight: 600;
        color: var(--ink-2);
        border-bottom: 2px solid var(--line);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .trials-table td {
        padding: var(--sp-3) var(--sp-4);
        border-bottom: 1px solid var(--line);
        color: var(--ink);
      }

      .trials-table tr:hover td {
        background: oklch(95.5% 0.01 55 / 50%);
      }

      .result-pass {
        color: oklch(45% 0.18 145);
        font-weight: 600;
      }
      .result-fail {
        color: oklch(50% 0.2 27);
        font-weight: 600;
      }

      /* Trajectory viewer */
      .traj-viewer {
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }

      .traj-picker {
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }

      .traj-picker-row {
        display: flex;
        gap: var(--sp-2);
        align-items: center;
        flex-wrap: wrap;
      }

      .traj-picker-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ink-2);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        min-width: 64px;
      }

      .traj-btn {
        padding: var(--sp-1) var(--sp-3);
        font-size: 0.75rem;
        font-weight: 500;
        font-family: inherit;
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        background: var(--bg-surface);
        color: var(--ink-2);
        cursor: pointer;
        transition: all 0.15s var(--ease);
      }

      .traj-btn:hover {
        border-color: var(--line-hover);
        color: var(--ink);
      }

      .traj-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .traj-btn.pass {
        border-color: oklch(72% 0.19 145 / 40%);
      }
      .traj-btn.fail {
        border-color: oklch(63% 0.24 27 / 40%);
      }

      .traj-steps {
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
      }

      .traj-step {
        display: flex;
        gap: var(--sp-3);
        padding: var(--sp-3);
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--bg-surface);
      }

      .step-badge {
        flex-shrink: 0;
        width: 32px;
        text-align: center;
        font-size: 0.6875rem;
        font-weight: 600;
        padding: 2px 0;
        border-radius: var(--radius-sm);
        color: var(--ink-3);
        background: var(--bg);
        font-variant-numeric: tabular-nums;
      }

      .step-tools {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
        min-width: 0;
      }

      .tool-call {
        border-radius: var(--radius-sm);
        overflow: hidden;
        border: 1px solid oklch(88% 0.015 55 / 80%);
      }

      .tool-call-header {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        padding: var(--sp-1) var(--sp-3);
        background: oklch(92% 0.01 55);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ink-2);
        cursor: pointer;
        user-select: none;
      }

      .tool-call-header:hover {
        background: oklch(90% 0.012 55);
      }

      .tool-call-header .tool-fn {
        font-family: var(--font-mono);
        color: oklch(40% 0.18 270);
        font-size: 0.75rem;
        flex-shrink: 0;
      }

      .tool-call-header .tool-preview {
        color: var(--ink-3);
        font-weight: 400;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }

      .tool-call-header .tool-arrow {
        margin-left: auto;
        color: var(--ink-3);
        transition: transform 0.15s var(--ease);
        font-size: 0.6875rem;
        flex-shrink: 0;
      }

      .tool-call-header.open .tool-arrow {
        transform: rotate(90deg);
      }

      .tool-call-body {
        display: block;
      }

      .tool-call-body.collapsed {
        display: none;
      }

      .tool-call-cmd {
        padding: var(--sp-2) var(--sp-3);
        background: oklch(15% 0.01 55);
        color: oklch(85% 0.01 55);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow-y: auto;
      }

      .tool-call-obs {
        padding: var(--sp-2) var(--sp-3);
        background: oklch(96% 0.008 55);
        font-family: var(--font-mono);
        font-size: 0.7rem;
        line-height: 1.5;
        color: var(--ink-2);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow-y: auto;
        border-top: 1px solid oklch(88% 0.015 55 / 80%);
      }

      /* Eval report */
      .eval-report {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        line-height: 1.6;
        white-space: pre-wrap;
        padding: var(--sp-3) var(--sp-4);
        background: oklch(15% 0.01 55);
        color: oklch(85% 0.01 55);
        border-radius: var(--radius-sm);
        max-height: 250px;
        overflow-y: auto;
      }

      /* Summary stats */
      .summary-bar {
        display: flex;
        gap: var(--sp-4);
        padding: var(--sp-2) var(--sp-4);
        border-bottom: 1px solid var(--line);
        background: var(--bg-surface);
        font-size: 0.75rem;
        color: var(--ink-3);
        flex-wrap: wrap;
      }

      .summary-bar strong {
        color: var(--ink-2);
        font-weight: 600;
      }

      /* Responsive */
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto 1fr;
          margin: 0;
          height: 100vh;
          border-radius: 0;
          border: none;
          box-shadow: none;
        }
        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--line);
          max-height: 40vh;
        }
        .main {
          padding: var(--sp-5);
        }
      }

      /* Scrollbar */
      .task-list::-webkit-scrollbar,
      .main::-webkit-scrollbar {
        width: 6px;
      }
      .task-list::-webkit-scrollbar-thumb,
      .main::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 3px;
      }
      .task-list::-webkit-scrollbar-thumb:hover,
      .main::-webkit-scrollbar-thumb:hover {
        background: var(--line-hover);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <nav class="app-header">
        <a href="/web-apps/" class="back">Apps</a>
        <span class="sep">/</span>
        <span class="title">AppWorld Explorer</span>
      </nav>

      <aside class="sidebar">
        <div class="summary-bar">
          <span><strong id="task-count">0</strong> tasks</span>
          <span><strong id="model-count">0</strong> models</span>
          <span><strong id="traj-count">0</strong> trajectories</span>
        </div>
        <div class="sidebar-controls">
          <input
            type="text"
            class="search-input"
            id="search"
            placeholder="Search tasks..."
          />
          <div class="filter-row">
            <select id="filter-split">
              <option value="">All splits</option>
              <option value="test_normal">Normal</option>
              <option value="test_challenge">Challenge</option>
            </select>
            <select id="filter-diff">
              <option value="">All levels</option>
              <option value="1">Level 1</option>
              <option value="2">Level 2</option>
              <option value="3">Level 3</option>
            </select>
            <select id="sort-by">
              <option value="discord-desc">Disagreement</option>
              <option value="id">Task ID</option>
              <option value="diff">Difficulty</option>
            </select>
          </div>
        </div>
        <div class="task-list" id="task-list"></div>
      </aside>

      <main class="main empty-state" id="main">
        <div class="empty-msg">Select a task from the sidebar</div>
      </main>
    </div>

    <script>
      let DATA = null;
      let TRAJ_CACHE = {};
      let selectedTask = null;
      let activeTab = "overview";
      let activeMethod = null;
      let activeExp = null;

      const METHOD_COLORS = {
        ReAct: "oklch(55% 0.15 180)",
        FullCodeRefl: "oklch(55% 0.2 270)",
        PlanExec: "oklch(60% 0.18 145)",
        LOOP: "oklch(58% 0.18 40)",
        "IBM CUGA": "oklch(55% 0.17 310)",
      };

      const METHOD_ORDER = [
        "IBM CUGA",
        "LOOP",
        "ReAct",
        "FullCodeRefl",
        "PlanExec",
      ];

      function getColor(method) {
        return METHOD_COLORS[method] || "oklch(55% 0.1 200)";
      }

      async function loadData() {
        try {
          const resp = await fetch("data/data.json");
          DATA = await resp.json();

          document.getElementById("task-count").textContent =
            Object.keys(DATA.tasks).length;
          document.getElementById("model-count").textContent =
            Object.keys(DATA.models).length;

          let trajCount = 0;
          for (const tid of Object.keys(DATA.task_results)) {
            trajCount += Object.keys(DATA.task_results[tid]).length;
          }
          document.getElementById("traj-count").textContent = trajCount;

          renderTaskList();
        } catch (e) {
          console.error("Failed to load data:", e);
          document.getElementById("task-list").innerHTML =
            '<div style="padding:1rem;color:var(--ink-3)">Failed to load data. Serve via HTTP.</div>';
        }
      }

      function getExperimentsForTask(tid) {
        const task = DATA.tasks[tid];
        if (!task) return [];
        const results = DATA.task_results[tid] || {};
        return Object.keys(results).filter(
          (exp) => DATA.models[exp]?.dataset === task.split,
        );
      }

      function getDisagreement(tid) {
        const results = DATA.task_results[tid];
        if (!results) return 0;
        const vals = Object.values(results);
        if (vals.length < 2) return 0;
        const passes = vals.filter((r) => r.success).length;
        const total = vals.length;
        const p = passes / total;
        return p * (1 - p) * 4;
      }

      function getFilteredTasks() {
        const search = document
          .getElementById("search")
          .value.toLowerCase()
          .trim();
        const split = document.getElementById("filter-split").value;
        const diff = document.getElementById("filter-diff").value;
        const sort = document.getElementById("sort-by").value;

        let tasks = Object.values(DATA.tasks).filter((t) => {
          if (
            search &&
            !t.instruction.toLowerCase().includes(search) &&
            !t.id.toLowerCase().includes(search)
          )
            return false;
          if (split && t.split !== split) return false;
          if (diff && String(t.difficulty) !== diff) return false;
          return true;
        });

        tasks.sort((a, b) => {
          if (sort === "discord-desc")
            return getDisagreement(b.id) - getDisagreement(a.id);
          if (sort === "diff") return a.difficulty - b.difficulty;
          return a.id.localeCompare(b.id);
        });

        return tasks;
      }

      function renderTaskList() {
        const tasks = getFilteredTasks();
        const list = document.getElementById("task-list");
        document.getElementById("task-count").textContent = tasks.length;

        list.innerHTML = tasks
          .map((t) => {
            const isActive = selectedTask === t.id;
            const exps = getExperimentsForTask(t.id);
            const results = DATA.task_results[t.id] || {};

            // Build mini bars — one per experiment, sorted by method
            const sortedExps = [...exps].sort((a, b) => {
              const ai = METHOD_ORDER.indexOf(DATA.models[a]?.method);
              const bi = METHOD_ORDER.indexOf(DATA.models[b]?.method);
              return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
            });

            const bars = sortedExps
              .map((exp) => {
                const r = results[exp];
                const m = DATA.models[exp];
                const h = r?.success ? 14 : 2;
                const color = getColor(m?.method);
                return `<div class="task-item-bar" style="height:${h}px;background:${color}"></div>`;
              })
              .join("");

            return `
          <div class="task-item ${isActive ? "active" : ""}" data-task="${t.id}">
            <div class="task-item-name">${esc(t.id)}</div>
            <div class="task-item-instruction">${esc(t.instruction)}</div>
            <div class="task-item-meta">
              <span class="mini-badge d${t.difficulty}">L${t.difficulty}</span>
              <span class="mini-split">${t.split === "test_normal" ? "normal" : "challenge"}</span>
              <div class="task-item-bars">${bars}</div>
            </div>
          </div>`;
          })
          .join("");

        list.querySelectorAll(".task-item").forEach((el) => {
          el.addEventListener("click", () => selectTask(el.dataset.task));
        });
      }

      function selectTask(tid) {
        selectedTask = tid;
        activeTab = "overview";
        activeMethod = null;
        activeExp = null;
        renderTaskList();
        renderDetail();
      }

      function renderDetail() {
        const main = document.getElementById("main");
        main.classList.remove("empty-state");

        const task = DATA.tasks[selectedTask];
        const results = DATA.task_results[selectedTask] || {};
        const exps = getExperimentsForTask(selectedTask);
        const passes = exps.filter((e) => results[e]?.success).length;

        main.innerHTML = `
        <div class="task-header">
          <div class="task-title">${esc(task.id)}</div>
          <div class="task-badges">
            <span class="mini-badge d${task.difficulty}" style="font-size:0.75rem;padding:2px 10px">Level ${task.difficulty}</span>
            <span class="meta-chip">${task.split === "test_normal" ? "normal" : "challenge"}</span>
            <span class="meta-chip">Supervisor: <strong>${esc(task.supervisor)}</strong></span>
            <span class="meta-chip">Pass: <strong>${passes}/${exps.length}</strong></span>
          </div>
        </div>

        <div class="detail-tabs">
          <button class="detail-tab ${activeTab === "overview" ? "active" : ""}" data-tab="overview">Overview</button>
          <button class="detail-tab ${activeTab === "trajectories" ? "active" : ""}" data-tab="trajectories">Trajectories</button>
        </div>

        <div id="tab-content"></div>
      `;

        main.querySelectorAll(".detail-tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeTab = btn.dataset.tab;
            renderDetail();
          });
        });

        if (activeTab === "overview") renderOverview(task, results, exps);
        else renderTrajectories(task, results, exps);
      }

      function renderOverview(task, results, exps) {
        const container = document.getElementById("tab-content");

        // Sort experiments: passes first, then by test pass ratio
        const sortedExps = [...exps].sort((a, b) => {
          const ra = results[a]?.success ? 1 : 0;
          const rb = results[b]?.success ? 1 : 0;
          if (ra !== rb) return rb - ra;
          const pa = (results[a]?.num_passed || 0) / (results[a]?.num_tests || 1);
          const pb = (results[b]?.num_passed || 0) / (results[b]?.num_tests || 1);
          return pb - pa;
        });

        // Score bars
        const scoreBars = sortedExps
          .map((exp) => {
            const r = results[exp];
            const m = DATA.models[exp];
            const testPct = r
              ? Math.round((r.num_passed / r.num_tests) * 100)
              : 0;
            const color = getColor(m.method);
            return `
          <div class="score-row">
            <div class="score-label" title="${m.llm_tooltip}">${esc(m.label)}</div>
            <div class="score-bar-bg">
              <div class="score-bar-fill" style="width:${testPct}%;background:${color}"></div>
            </div>
            <div class="score-pct">${testPct}%</div>
          </div>`;
          })
          .join("");

        // Trials table
        let trialRows = "";
        for (const exp of sortedExps) {
          const r = results[exp];
          const m = DATA.models[exp];
          trialRows += `
          <tr>
            <td>${esc(m.method)}</td>
            <td>${esc(m.llm)}</td>
            <td class="${r?.success ? "result-pass" : "result-fail"}">${r?.success ? "Pass" : "Fail"}</td>
            <td>${r?.num_passed || 0}/${r?.num_tests || 0}</td>
          </tr>`;
        }

        container.innerHTML = `
        <div class="scores-section">
          <div class="section-heading">Test Pass Rate by Model</div>
          ${scoreBars}
        </div>

        <div>
          <div class="section-heading">Instruction</div>
          <div class="instruction-text">${esc(task.instruction)}</div>
        </div>

        <div>
          <div class="section-heading">Results</div>
          <div style="overflow-x:auto">
            <table class="trials-table">
              <thead>
                <tr>
                  <th>Method</th>
                  <th>Model</th>
                  <th>Result</th>
                  <th>Tests Passed</th>
                </tr>
              </thead>
              <tbody>${trialRows}</tbody>
            </table>
          </div>
        </div>
      `;
      }

      async function renderTrajectories(task, results, exps) {
        const container = document.getElementById("tab-content");

        // Load trajectory data
        if (!TRAJ_CACHE[task.id]) {
          container.innerHTML =
            '<div style="color:var(--ink-3);padding:var(--sp-4)">Loading trajectories...</div>';
          try {
            const resp = await fetch(`data/traj/${task.id}.json`);
            TRAJ_CACHE[task.id] = await resp.json();
          } catch {
            container.innerHTML =
              '<div style="color:var(--ink-3);padding:var(--sp-4)">No trajectory data available</div>';
            return;
          }
        }

        const trajData = TRAJ_CACHE[task.id];
        const trajKeys = Object.keys(trajData).filter((k) => exps.includes(k));

        // Group by method
        const byMethod = {};
        for (const k of trajKeys) {
          const method = trajData[k].method;
          if (!byMethod[method]) byMethod[method] = [];
          byMethod[method].push(k);
        }
        const methods = Object.keys(byMethod).sort((a, b) => {
          const ai = METHOD_ORDER.indexOf(a);
          const bi = METHOD_ORDER.indexOf(b);
          return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
        });

        // Default method
        if (!activeMethod || !byMethod[activeMethod]) {
          activeMethod = methods[0] || null;
        }

        // Default experiment in active method
        const methodExps = byMethod[activeMethod] || [];
        if (!activeExp || !methodExps.includes(activeExp)) {
          activeExp = methodExps[0] || null;
        }

        // Method picker
        const methodBtns = methods
          .map((m) => {
            const cls = [
              "traj-btn",
              activeMethod === m ? "active" : "",
            ]
              .filter(Boolean)
              .join(" ");
            return `<button class="${cls}" data-method="${m}">${esc(m)}</button>`;
          })
          .join("");

        // Model picker within method
        const modelBtns = methodExps
          .map((k) => {
            const t = trajData[k];
            const isPass = t.success;
            const cls = [
              "traj-btn",
              activeExp === k ? "active" : "",
              isPass ? "pass" : "fail",
            ]
              .filter(Boolean)
              .join(" ");
            return `<button class="${cls}" data-exp="${k}">${isPass ? "Pass" : "Fail"}: ${esc(t.llm)}</button>`;
          })
          .join("");

        const pickerHtml = `
          <div class="traj-picker-row">
            <span class="traj-picker-label">Method</span>
            ${methodBtns}
          </div>
          <div class="traj-picker-row">
            <span class="traj-picker-label">Model</span>
            ${modelBtns}
          </div>`;

        // Steps
        let stepsHtml = "";
        if (activeExp && trajData[activeExp]) {
          const traj = trajData[activeExp];

          // Meta chips
          const meta = [];
          meta.push(
            traj.success
              ? `<span class="meta-chip"><strong class="result-pass">Pass</strong></span>`
              : `<span class="meta-chip"><strong class="result-fail">Fail</strong></span>`,
          );
          meta.push(
            `<span class="meta-chip">Steps: <strong>${traj.num_interactions}</strong></span>`,
          );
          meta.push(
            `<span class="meta-chip">API calls: <strong>${traj.api_call_count}</strong></span>`,
          );
          if (traj.num_tests) {
            meta.push(
              `<span class="meta-chip">Tests: <strong>${traj.num_passed}/${traj.num_tests}</strong></span>`,
            );
          }

          const metaHtml = `<div style="display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-2)">${meta.join("")}</div>`;

          // Eval report
          let evalHtml = "";
          if (traj.eval_report) {
            evalHtml = `
            <div style="margin-bottom:var(--sp-4)">
              <div class="section-heading">Evaluation Report</div>
              <div class="eval-report">${esc(traj.eval_report)}</div>
            </div>`;
          }

          // Interaction steps as tool calls
          const steps = traj.steps || [];
          const stepsInner = steps
            .map((s, i) => {
              const preview = s.action.split("\n")[0].slice(0, 80);
              const hasOutput = s.output && s.output.length > 0;
              return `
            <div class="traj-step">
              <div class="step-badge">${i + 1}</div>
              <div class="step-tools">
                <div class="tool-call">
                  <div class="tool-call-header" data-tool="${i}">
                    <span class="tool-fn">python</span>
                    <span class="tool-preview">${esc(preview)}</span>
                    <span class="tool-arrow">&#9654;</span>
                  </div>
                  <div class="tool-call-body collapsed" data-tool-body="${i}">
                    <div class="tool-call-cmd">${esc(s.action)}</div>
                    ${hasOutput ? `<div class="tool-call-obs">${esc(s.output)}</div>` : ""}
                  </div>
                </div>
              </div>
            </div>`;
            })
            .join("");

          stepsHtml =
            metaHtml +
            evalHtml +
            `<div class="section-heading">Interaction Trace (${steps.length} steps)</div>` +
            `<div class="traj-steps">${stepsInner}</div>`;
        }

        container.innerHTML = `
        <div class="traj-viewer">
          <div class="traj-picker">${pickerHtml}</div>
          <div id="traj-steps-container">${stepsHtml}</div>
        </div>
      `;

        // Method picker events
        container.querySelectorAll("[data-method]").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeMethod = btn.dataset.method;
            activeExp = null;
            renderTrajectories(task, results, exps);
          });
        });

        // Model picker events
        container.querySelectorAll("[data-exp]").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeExp = btn.dataset.exp;
            renderTrajectories(task, results, exps);
          });
        });

        // Tool call toggle events
        container
          .querySelectorAll(".tool-call-header[data-tool]")
          .forEach((hdr) => {
            hdr.addEventListener("click", () => {
              const id = hdr.dataset.tool;
              const body = container.querySelector(
                `.tool-call-body[data-tool-body="${id}"]`,
              );
              if (body) {
                hdr.classList.toggle("open");
                body.classList.toggle("collapsed");
              }
            });
          });
      }

      // Helpers
      function esc(s) {
        if (!s) return "";
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // Events
      document
        .getElementById("search")
        .addEventListener("input", renderTaskList);
      document
        .getElementById("filter-split")
        .addEventListener("change", renderTaskList);
      document
        .getElementById("filter-diff")
        .addEventListener("change", renderTaskList);
      document
        .getElementById("sort-by")
        .addEventListener("change", renderTaskList);

      loadData();
    </script>
  </body>
</html>
