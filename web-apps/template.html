<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/web-apps/shared.css" />
    <style>
      :root {
        --accent: oklch(55% 0.2 260);
        --accent-soft: oklch(55% 0.2 260 / 12%);
      }

      body {
        padding: 2rem;
        padding-top: 2rem;
      }

      h1 {
        margin-bottom: 1.25rem;
      }

      /* layout -------------------------------------------------*/
      .container {
        display: flex;
        gap: 2rem;
        align-items: flex-start;
      }

      .viewer {
        flex: 1 1 50%;
        background: var(--bg-surface);
        border-radius: var(--radius-sm);
        padding: 1.25rem 1.5rem;
        box-shadow: var(--shadow-sm);
        max-height: 80vh;
        overflow: auto;
      }

      /* grid (cards list) ------------------------------------*/
      .cards {
        display: grid;
        gap: 2rem;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }

      @media (min-width: 1600px) {
        .cards {
          grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }
      }

      /* card ----------------------------------------------------*/
      .card {
        background: var(--bg-surface);
        border-radius: var(--radius-sm);
        padding: 1.25rem 1.5rem;
        box-shadow: var(--shadow-sm);
        transition: 0.2s ease all;
      }

      .card:hover {
        box-shadow: var(--shadow-md);
      }

      /* title ---------------------------------------------------*/
      .card h2 {
        margin: 0 0 0.5rem;
        font-size: 1.1rem;
        color: var(--ink);
        cursor: pointer;
        transition: color 0.15s;
      }

      .card h2:hover {
        color: var(--accent);
      }

      /* snippet preview ----------------------------------------*/
      .card .snippet {
        color: var(--ink-2);
        font-style: italic;
        line-height: 1.45;
        margin: 0 0 0.75rem;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* full text block ----------------------------------------*/
      .card pre {
        display: none;
        white-space: pre-wrap;
        background: var(--bg);
        padding: 1rem;
        border-radius: 6px;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .card.open pre {
        display: block;
      }

      .card.open .snippet {
        display: none;
      }

      /* copy button --------------------------------------------*/
      #copy-btn {
        padding: 0.5rem 1rem;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s;
      }

      #copy-btn:hover {
        background: var(--accent-hover);
      }

      .card.selected {
        background: oklch(95% 0.04 85);
        border: 1px solid oklch(80% 0.12 85);
      }
    </style>
  </head>

  <body>
    <nav class="app-header">
      <a href="/web-apps/" class="back">Apps</a>
      <span class="sep">/</span>
      <span class="title">Note Search</span>
    </nav>

    <h1>Results for "{{QUERY}}"</h1>
    <button id="copy-btn" type="button">Copy All</button>

    <div class="container">
      <div id="viewer" class="viewer">
        <p>Select a note to view full content</p>
      </div>
      <div class="cards" id="cards">{{ITEMS}}</div>
    </div>
    <script id="data-json" type="application/json">
      {{DATA}}
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/marked@17.0.1/marked.min.js"
      integrity="sha384-tkjnnf9Tzhv5ZFrDroGvUExw9C3EVFo0RFRkzKR8ZX4b5Psoec4yb1PlD8Jh4j4H"
      crossorigin="anonymous"
    ></script>
    <script src="{{SCRIPT_SRC}}"></script>
  </body>
</html>
