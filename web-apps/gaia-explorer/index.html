<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore GAIA benchmark agent traces across models"
    />
    <meta name="theme-color" content="#f3efe9" />
    <link rel="icon" href="/web-apps/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/web-apps/manifest.json" />
    <link
      rel="canonical"
      href="https://yoonholee.com/web-apps/gaia-explorer/"
    />
    <meta property="og:title" content="GAIA Trace Explorer" />
    <meta
      property="og:description"
      content="Explore GAIA benchmark agent traces across models"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://yoonholee.com/web-apps/gaia-explorer/"
    />
    <title>GAIA Trace Explorer</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="/web-apps/shared.css" />
    <style>
      :root {
        --accent: oklch(55% 0.15 180);
        --accent-soft: oklch(55% 0.15 180 / 12%);
      }

      /* Layout */
      .app {
        display: grid;
        grid-template-columns: 440px 1fr;
        grid-template-rows: auto 1fr;
        height: calc(100vh - 32px);
        overflow: hidden;
        max-width: 1600px;
        margin: 16px auto;
        border-radius: var(--radius-lg);
        border: 1px solid var(--line);
        box-shadow: var(--shadow-md);
      }

      .app-header {
        grid-column: 1 / -1;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      }

      /* Sidebar */
      .sidebar {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        overflow: hidden;
        background: var(--bg);
      }

      .sidebar-controls {
        padding: var(--sp-3) var(--sp-4);
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
      }

      .search-input {
        width: 100%;
        padding: var(--sp-2) var(--sp-3);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        color: var(--ink);
        font-size: 0.8125rem;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s var(--ease);
      }

      .search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .filter-row {
        display: flex;
        gap: var(--sp-2);
      }

      .filter-row select {
        flex: 1;
        padding: var(--sp-1) var(--sp-2);
        font-size: 0.75rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        color: var(--ink-2);
        font-family: inherit;
      }

      .task-list {
        flex: 1;
        overflow-y: auto;
        padding: var(--sp-2);
      }

      .task-item {
        display: flex;
        flex-direction: column;
        gap: var(--sp-1);
        padding: var(--sp-3);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background 0.15s var(--ease);
        border: 1px solid transparent;
      }

      .task-item:hover {
        background: var(--bg-surface);
      }

      .task-item.active {
        background: var(--bg-surface);
        border-color: var(--accent);
        box-shadow: var(--shadow-sm);
      }

      .task-item-name {
        font-size: 0.8125rem;
        color: var(--ink);
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .task-item-meta {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        flex-wrap: wrap;
      }

      .task-item-bars {
        display: flex;
        gap: 3px;
        align-items: flex-end;
        height: 14px;
        margin-left: auto;
      }

      .task-item-bar {
        width: 8px;
        height: 10px;
        border-radius: 2px;
      }

      /* Mini badges */
      .mini-badge {
        display: inline-flex;
        align-items: center;
        padding: 1px 6px;
        font-size: 0.6875rem;
        font-weight: 500;
        border-radius: var(--radius-pill);
        line-height: 1.6;
        background: var(--accent-soft);
        color: var(--accent);
      }

      .mini-badge.level-1 {
        background: oklch(72% 0.19 145 / 12%);
        color: oklch(40% 0.15 145);
      }
      .mini-badge.level-2 {
        background: oklch(65% 0.2 55 / 12%);
        color: oklch(45% 0.15 55);
      }
      .mini-badge.level-3 {
        background: oklch(55% 0.22 25 / 12%);
        color: oklch(40% 0.18 25);
      }
      .mini-badge.source-other {
        background: oklch(60% 0.02 270 / 10%);
        color: var(--ink-3);
      }

      .mini-models {
        font-size: 0.6875rem;
        color: var(--ink-3);
      }

      /* Main content */
      .main {
        overflow-y: auto;
        padding: var(--sp-8) var(--sp-10);
        display: flex;
        flex-direction: column;
        gap: var(--sp-8);
      }

      .main.empty-state {
        align-items: center;
        justify-content: center;
      }

      .empty-msg {
        color: var(--ink-3);
        font-size: 0.9375rem;
      }

      /* Task header */
      .task-header {
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }

      .task-title {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--ink);
        line-height: 1.5;
      }

      .task-badges {
        display: flex;
        gap: var(--sp-2) var(--sp-3);
        align-items: center;
        flex-wrap: wrap;
      }

      .meta-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        font-size: 0.8125rem;
        color: var(--ink-2);
        background: var(--bg-surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
      }

      .meta-chip strong {
        font-weight: 600;
        color: var(--ink);
      }

      /* Section heading */
      .section-heading {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--ink-2);
        margin-bottom: var(--sp-4);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* Trajectory viewer */
      .traj-viewer {
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }

      .traj-picker {
        display: flex;
        flex-direction: column;
        gap: var(--sp-3);
      }

      .traj-picker-row {
        display: flex;
        gap: var(--sp-2);
        align-items: center;
        flex-wrap: wrap;
      }

      .traj-picker-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ink-2);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        min-width: 64px;
      }

      .traj-btn {
        padding: var(--sp-1) var(--sp-3);
        font-size: 0.75rem;
        font-weight: 500;
        font-family: inherit;
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        background: var(--bg-surface);
        color: var(--ink-2);
        cursor: pointer;
        transition: all 0.15s var(--ease);
      }

      .traj-btn:hover {
        border-color: var(--line-hover);
        color: var(--ink);
      }

      .traj-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .traj-steps {
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
      }

      .traj-step {
        display: flex;
        gap: var(--sp-3);
        padding: var(--sp-3);
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--bg-surface);
      }

      .step-badge {
        flex-shrink: 0;
        width: 32px;
        text-align: center;
        font-size: 0.6875rem;
        font-weight: 600;
        padding: 2px 0;
        border-radius: var(--radius-sm);
        color: var(--ink-3);
        background: var(--bg);
        font-variant-numeric: tabular-nums;
      }

      .step-tools {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
        min-width: 0;
      }

      .step-thought {
        font-size: 0.8125rem;
        line-height: 1.6;
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 120px;
        overflow: hidden;
        position: relative;
      }

      .step-thought.expanded {
        max-height: none;
      }

      .step-thought:not(.expanded)::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 30px;
        background: linear-gradient(transparent, var(--bg-surface));
        pointer-events: none;
      }

      .step-thought.short::after {
        display: none;
      }

      .step-expand {
        background: none;
        border: none;
        color: var(--ink-3);
        cursor: pointer;
        font-size: 0.75rem;
        font-family: inherit;
        padding: 0;
      }

      .step-expand:hover {
        color: var(--accent);
      }

      .tool-call {
        border-radius: var(--radius-sm);
        overflow: hidden;
        border: 1px solid oklch(88% 0.015 55 / 80%);
      }

      .tool-call-header {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        padding: var(--sp-1) var(--sp-3);
        background: oklch(92% 0.01 55);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ink-2);
        cursor: pointer;
        user-select: none;
      }

      .tool-call-header:hover {
        background: oklch(90% 0.012 55);
      }

      .tool-call-header .tool-fn {
        font-family: var(--font-mono);
        color: oklch(40% 0.18 270);
        font-size: 0.75rem;
        flex-shrink: 0;
      }

      .tool-call-header .tool-preview {
        color: var(--ink-3);
        font-weight: 400;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }

      .tool-call-header .tool-arrow {
        margin-left: auto;
        color: var(--ink-3);
        transition: transform 0.15s var(--ease);
        font-size: 0.6875rem;
        flex-shrink: 0;
      }

      .tool-call-header.open .tool-arrow {
        transform: rotate(90deg);
      }

      .tool-call-body {
        display: block;
      }

      .tool-call-body.collapsed {
        display: none;
      }

      .tool-call-cmd {
        padding: var(--sp-2) var(--sp-3);
        background: oklch(15% 0.01 55);
        color: oklch(85% 0.01 55);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow-y: auto;
      }

      .tool-call-obs {
        padding: var(--sp-2) var(--sp-3);
        background: oklch(96% 0.008 55);
        font-family: var(--font-mono);
        font-size: 0.7rem;
        line-height: 1.5;
        color: var(--ink-2);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow-y: auto;
        border-top: 1px solid oklch(88% 0.015 55 / 80%);
      }

      /* Final answer */
      .final-answer {
        padding: var(--sp-4);
        background: oklch(72% 0.19 145 / 8%);
        border: 1px solid oklch(72% 0.19 145 / 25%);
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        line-height: 1.6;
      }

      .final-answer-label {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: oklch(40% 0.15 145);
        margin-bottom: var(--sp-1);
      }

      .final-answer-text {
        color: var(--ink);
        font-weight: 500;
      }

      /* Summary stats */
      .summary-bar {
        display: flex;
        gap: var(--sp-4);
        padding: var(--sp-2) var(--sp-4);
        border-bottom: 1px solid var(--line);
        background: var(--bg-surface);
        font-size: 0.75rem;
        color: var(--ink-3);
        flex-wrap: wrap;
      }

      .summary-bar strong {
        color: var(--ink-2);
        font-weight: 600;
      }

      /* Responsive */
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto 1fr;
          margin: 0;
          height: 100vh;
          border-radius: 0;
          border: none;
          box-shadow: none;
        }
        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--line);
          max-height: 40vh;
        }
        .main {
          padding: var(--sp-5);
        }
      }

      /* Scrollbar */
      .task-list::-webkit-scrollbar,
      .main::-webkit-scrollbar {
        width: 6px;
      }
      .task-list::-webkit-scrollbar-thumb,
      .main::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 3px;
      }
      .task-list::-webkit-scrollbar-thumb:hover,
      .main::-webkit-scrollbar-thumb:hover {
        background: var(--line-hover);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <nav class="app-header">
        <a href="/web-apps/" class="back">Apps</a>
        <span class="sep">/</span>
        <span class="title">GAIA Trace Explorer</span>
      </nav>

      <aside class="sidebar">
        <div class="summary-bar">
          <span><strong id="task-count">0</strong> questions</span>
          <span><strong id="gaia-count">0</strong> GAIA</span>
          <span><strong>3</strong> models</span>
          <span><strong id="traj-count">0</strong> traces</span>
        </div>
        <div class="sidebar-controls">
          <input
            type="text"
            class="search-input"
            id="search"
            placeholder="Search questions..."
          />
          <div class="filter-row">
            <select id="filter-source">
              <option value="">All sources</option>
              <option value="gaia">GAIA only</option>
              <option value="other">Other tasks</option>
              <option value="L1">GAIA Level 1</option>
              <option value="L2">GAIA Level 2</option>
              <option value="L3">GAIA Level 3</option>
            </select>
            <select id="filter-models">
              <option value="">All coverage</option>
              <option value="3">3 models</option>
              <option value="2">2+ models</option>
              <option value="1">1 model</option>
            </select>
            <select id="sort-by">
              <option value="models-desc">Most models</option>
              <option value="level">Level</option>
              <option value="id">Question ID</option>
              <option value="short">Shortest</option>
              <option value="long">Longest</option>
            </select>
          </div>
        </div>
        <div class="task-list" id="task-list"></div>
      </aside>

      <main class="main empty-state" id="main">
        <div class="empty-msg">Select a question from the sidebar</div>
      </main>
    </div>

    <script>
      let DATA = null;
      let TRAJ_CACHE = {};
      let selectedTask = null;
      let activeModel = null;

      const MODEL_COLORS = {
        "gpt-4o": "oklch(55% 0.15 180)",
        "Qwen/Qwen2.5-Coder-32B-Instruct": "oklch(55% 0.2 270)",
        "meta-llama/Llama-4-Scout-17B-16E-Instruct": "oklch(60% 0.18 145)",
      };

      function getColor(modelId) {
        return MODEL_COLORS[modelId] || "oklch(55% 0.1 200)";
      }

      function modelShort(modelId) {
        return DATA.model_short[modelId] || modelId;
      }

      async function loadData() {
        try {
          const resp = await fetch("data/data.json");
          DATA = await resp.json();

          const allTasks = Object.values(DATA.tasks);
          document.getElementById("task-count").textContent = allTasks.length;
          document.getElementById("gaia-count").textContent = allTasks.filter(t => t.source === "gaia").length;

          let trajCount = 0;
          for (const t of allTasks) {
            trajCount += t.num_models;
          }
          document.getElementById("traj-count").textContent = trajCount;

          renderTaskList();
        } catch (e) {
          console.error("Failed to load data:", e);
          document.getElementById("task-list").innerHTML =
            '<div style="padding:1rem;color:var(--ink-3)">Failed to load data. Serve via HTTP.</div>';
        }
      }

      function getFilteredTasks() {
        const search = document
          .getElementById("search")
          .value.toLowerCase()
          .trim();
        const modelFilter = document.getElementById("filter-models").value;
        const sourceFilter = document.getElementById("filter-source").value;
        const sort = document.getElementById("sort-by").value;

        let tasks = Object.values(DATA.tasks).filter((t) => {
          if (search && !t.question.toLowerCase().includes(search))
            return false;
          if (modelFilter) {
            const n = parseInt(modelFilter);
            if (modelFilter === "2") {
              if (t.num_models < 2) return false;
            } else {
              if (t.num_models !== n) return false;
            }
          }
          if (sourceFilter) {
            if (sourceFilter === "gaia" && t.source !== "gaia") return false;
            if (sourceFilter === "other" && t.source !== "other") return false;
            if (sourceFilter === "L1" && t.level !== 1) return false;
            if (sourceFilter === "L2" && t.level !== 2) return false;
            if (sourceFilter === "L3" && t.level !== 3) return false;
          }
          return true;
        });

        tasks.sort((a, b) => {
          if (sort === "models-desc") return b.num_models - a.num_models;
          if (sort === "level") {
            const la = a.level || 99, lb = b.level || 99;
            return la - lb || a.id.localeCompare(b.id);
          }
          if (sort === "short")
            return a.question.length - b.question.length;
          if (sort === "long")
            return b.question.length - a.question.length;
          return a.id.localeCompare(b.id);
        });

        return tasks;
      }

      function renderTaskList() {
        const tasks = getFilteredTasks();
        const list = document.getElementById("task-list");
        document.getElementById("task-count").textContent = tasks.length;

        list.innerHTML = tasks
          .map((t) => {
            const isActive = selectedTask === t.id;

            const bars = DATA.models
              .map((m) => {
                const has = t.models.includes(m);
                const color = has ? getColor(m) : "var(--line)";
                return `<div class="task-item-bar" style="background:${color}"></div>`;
              })
              .join("");

            let badges = "";
            if (t.level) {
              badges += `<span class="mini-badge level-${t.level}">L${t.level}</span>`;
            } else if (t.source === "other") {
              badges += `<span class="mini-badge source-other">math</span>`;
            }
            badges += `<span class="mini-badge">${t.num_models} model${t.num_models > 1 ? "s" : ""}</span>`;

            return `
          <div class="task-item ${isActive ? "active" : ""}" data-task="${t.id}">
            <div class="task-item-name">${esc(t.question)}</div>
            <div class="task-item-meta">
              ${badges}
              <div class="task-item-bars">${bars}</div>
            </div>
          </div>`;
          })
          .join("");

        list.querySelectorAll(".task-item").forEach((el) => {
          el.addEventListener("click", () => selectTask(el.dataset.task));
        });
      }

      function selectTask(tid) {
        selectedTask = tid;
        activeModel = null;
        renderTaskList();
        renderDetail();
      }

      async function renderDetail() {
        const main = document.getElementById("main");
        main.classList.remove("empty-state");

        const task = DATA.tasks[selectedTask];

        // Load trajectory
        if (!TRAJ_CACHE[task.id]) {
          main.innerHTML =
            '<div style="color:var(--ink-3);padding:var(--sp-4)">Loading traces...</div>';
          try {
            const resp = await fetch(`data/traj/${task.id}.json`);
            TRAJ_CACHE[task.id] = await resp.json();
          } catch {
            main.innerHTML =
              '<div style="color:var(--ink-3);padding:var(--sp-4)">No trace data available</div>';
            return;
          }
        }

        const trajData = TRAJ_CACHE[task.id];
        const modelKeys = Object.keys(trajData);

        // Default model
        if (!activeModel || !trajData[activeModel]) {
          activeModel = modelKeys[0] || null;
        }

        // Model picker
        const modelBtns = modelKeys
          .map((k) => {
            const t = trajData[k];
            const cls = [
              "traj-btn",
              activeModel === k ? "active" : "",
            ]
              .filter(Boolean)
              .join(" ");
            return `<button class="${cls}" data-model="${k}">${esc(t.model)} (${t.num_steps} steps)</button>`;
          })
          .join("");

        // Active trajectory
        let stepsHtml = "";
        if (activeModel && trajData[activeModel]) {
          const traj = trajData[activeModel];

          // Meta
          const meta = [
            `<span class="meta-chip">Steps: <strong>${traj.num_steps}</strong></span>`,
            `<span class="meta-chip">Messages: <strong>${traj.num_messages}</strong></span>`,
          ];

          const metaHtml = `<div style="display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-3)">${meta.join("")}</div>`;

          // Final answer
          let answerHtml = "";
          if (traj.final_answer) {
            answerHtml = `
            <div class="final-answer">
              <div class="final-answer-label">Final Answer</div>
              <div class="final-answer-text">${esc(traj.final_answer)}</div>
            </div>`;
          }

          // Steps
          const steps = traj.steps || [];
          const stepsInner = steps
            .map((s, i) => {
              const codePreview = s.code
                ? s.code.split("\n")[0].slice(0, 80)
                : "";
              const hasObs = s.observation && s.observation.length > 0;
              const thoughtLen = s.thought.length;

              let thoughtHtml = "";
              if (s.thought) {
                const isShort = thoughtLen <= 200;
                thoughtHtml = `
                <div class="step-thought ${isShort ? "short" : ""}" data-thought="${i}">${esc(s.thought)}</div>
                ${!isShort ? `<button class="step-expand" data-expand="${i}">expand</button>` : ""}`;
              }

              let codeHtml = "";
              if (s.code) {
                codeHtml = `
                <div class="tool-call">
                  <div class="tool-call-header" data-tool="${i}">
                    <span class="tool-fn">python</span>
                    <span class="tool-preview">${esc(codePreview)}</span>
                    <span class="tool-arrow">&#9654;</span>
                  </div>
                  <div class="tool-call-body collapsed" data-tool-body="${i}">
                    <div class="tool-call-cmd">${esc(s.code)}</div>
                    ${hasObs ? `<div class="tool-call-obs">${esc(s.observation)}</div>` : ""}
                  </div>
                </div>`;
              } else if (hasObs) {
                codeHtml = `
                <div class="tool-call">
                  <div class="tool-call-header" data-tool="${i}">
                    <span class="tool-fn">observation</span>
                    <span class="tool-arrow">&#9654;</span>
                  </div>
                  <div class="tool-call-body collapsed" data-tool-body="${i}">
                    <div class="tool-call-obs">${esc(s.observation)}</div>
                  </div>
                </div>`;
              }

              return `
            <div class="traj-step">
              <div class="step-badge">${i + 1}</div>
              <div class="step-tools">
                ${thoughtHtml}
                ${codeHtml}
              </div>
            </div>`;
            })
            .join("");

          stepsHtml =
            metaHtml +
            answerHtml +
            `<div style="margin-top:var(--sp-4)"><div class="section-heading">Trace (${steps.length} steps)</div></div>` +
            `<div class="traj-steps">${stepsInner}</div>`;
        }

        let headerBadges = `<span class="meta-chip">ID: <strong>${esc(task.id)}</strong></span>`;
        if (task.level) {
          headerBadges += `<span class="meta-chip">Level <strong>${task.level}</strong></span>`;
          headerBadges += `<span class="meta-chip">Split: <strong>${task.split}</strong></span>`;
        } else if (task.source === "other") {
          headerBadges += `<span class="meta-chip">Source: <strong>math/reasoning</strong></span>`;
        }
        headerBadges += `<span class="meta-chip">${task.num_models} model${task.num_models > 1 ? "s" : ""}</span>`;

        let groundTruthHtml = "";
        if (task.ground_truth) {
          groundTruthHtml = `
          <div class="final-answer" style="margin-top:var(--sp-2)">
            <div class="final-answer-label">Ground Truth</div>
            <div class="final-answer-text">${esc(task.ground_truth)}</div>
          </div>`;
        }

        main.innerHTML = `
        <div class="task-header">
          <div class="task-title">${esc(task.question)}</div>
          <div class="task-badges">${headerBadges}</div>
          ${groundTruthHtml}
        </div>

        <div class="traj-viewer">
          <div class="traj-picker">
            <div class="traj-picker-row">
              <span class="traj-picker-label">Model</span>
              ${modelBtns}
            </div>
          </div>
          <div id="traj-steps-container">${stepsHtml}</div>
        </div>
      `;

        // Model picker events
        main.querySelectorAll("[data-model]").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeModel = btn.dataset.model;
            renderDetail();
          });
        });

        // Tool call toggle events
        main
          .querySelectorAll(".tool-call-header[data-tool]")
          .forEach((hdr) => {
            hdr.addEventListener("click", () => {
              const id = hdr.dataset.tool;
              const body = main.querySelector(
                `.tool-call-body[data-tool-body="${id}"]`,
              );
              if (body) {
                hdr.classList.toggle("open");
                body.classList.toggle("collapsed");
              }
            });
          });

        // Thought expand events
        main.querySelectorAll(".step-expand[data-expand]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = btn.dataset.expand;
            const thought = main.querySelector(
              `.step-thought[data-thought="${idx}"]`,
            );
            if (thought) {
              thought.classList.toggle("expanded");
              btn.textContent = thought.classList.contains("expanded")
                ? "collapse"
                : "expand";
            }
          });
        });
      }

      // Helpers
      function esc(s) {
        if (!s) return "";
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // Events
      document
        .getElementById("search")
        .addEventListener("input", renderTaskList);
      document
        .getElementById("filter-source")
        .addEventListener("change", renderTaskList);
      document
        .getElementById("filter-models")
        .addEventListener("change", renderTaskList);
      document
        .getElementById("sort-by")
        .addEventListener("change", renderTaskList);

      loadData();
    </script>
  </body>
</html>
