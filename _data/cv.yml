- title: Experience
  type: time_table
  contents:
    - title: Machine Learning Specialist at Pacefactory
      institution: Pacefactory inc., Oakville, Canada
      year: Dec 2023 - Present
      description:
        - Built a real-time object recognition system that identifies objects from motion geometry alone, without processing any image pixels — 1M inferences in 3s on standard hardware at a 0.92 macro-average score.
        - Designed a two-tier visual state classification system for low-latency inference — classical feature matching (HOG, SSIM, template matching) for high-speed scenarios, and HDBSCAN clustering over pretrained CLIP embeddings for label-free state discovery.
        - Built a self-serve tool so operators annotate object trails and train their own per-camera classifier without ML expertise.
        - Accelerated annotation with Grounding DINO and Rex-Omni for text- and visual-prompted labeling, and SAM for copy-paste annotation transfer.
        - Implemented iterative model-assisted annotation using YOLO and XGBoost — auto-label, correct, retrain loops.
        - Developed training and export pipelines for detection, keypoint, and segmentation models, from raw video to deployment-ready outputs.

    - title: Research Assistant
      institution: University of Ottawa, Ottawa, Canada
      year: Jan 2021 - Nov 2023
      description:
        - Developed a two-phase adversarial attack on deep embedding models — gradient-free embedding-space search plus gradient-based input realization, crafting inputs that collectively impersonate many enrolled identities (arXiv).
        - Developed a novel algorithm to determine whether a GAN is sufficiently trained without human oversight, validated on imagery and tabular data (published).
        - Investigated generative adversarial networks for class imbalance and small-sample learning, leading to two publications.

    - title: Software Engineer at Armeh Sazeh Co.
      institution: Armeh Sazeh Co., Tehran, Iran
      year: Jan 2020 - Aug 2021
      description:
        - Designed and implemented web-based software to automate the company's processes.
        - Served as the main point of contact between the team and the client — communication, task delegation, requirements gathering, and back-end development.
        - Designed and implemented Windows-based software in C++ to automate internal company processes.


